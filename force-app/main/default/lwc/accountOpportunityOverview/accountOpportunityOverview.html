<template>
    <lightning-card title="Account Opportunity Overview">
        <div class="slds-p-around_medium">
            
            <!-- Simple loading indicator -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..."></lightning-spinner>
            </template>

            <!-- Accordion Layout -->
            <template if:false={isLoading}>
                <lightning-accordion allow-multiple-sections-open>
                    <template for:each={accountData} for:item="wrap">
                        
                        <!-- Simple Accordion Section Header -->
                        <lightning-accordion-section 
                            key={wrap.acc.Id} 
                            name={wrap.acc.Id} 
                            label={wrap.acc.Name}>
                            
                            <!-- Display Basic Summary Fields at the top of the expanded section -->
                            <p class="slds-m-bottom_small">
                                <strong>Total Opportunities:</strong> {wrap.oppCount} | 
                                <strong>Total Value:</strong> ${wrap.totalAmount}
                            </p>

                            <!-- Check if opportunities exist -->
                            <template if:true={wrap.oppCount}>
                                <template for:each={wrap.opps} for:item="opp">
                                    <div key={opp.Id} class="slds-box slds-m-bottom_small slds-grid">
                                        <div class="slds-col slds-size_2-of-3">
                                            <p><strong>Name:</strong> {opp.Name}</p>
                                            <p><strong>Stage:</strong> {opp.StageName}</p>
                                            <p><strong>Amount:</strong> ${opp.Amount}</p>
                                        </div>
                                        <div class="slds-col slds-size_1-of-3 slds-text-align_right">
                                            <!-- Simple button: Only shows up if the opportunity is NOT closed -->
                                            <template if:false={opp.IsClosed}>
                                                <lightning-button 
                                                    label="Mark as Closed" 
                                                    data-id={opp.Id}
                                                    onclick={handleMarkAsClosedClick}>
                                                </lightning-button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </template>

                            <!-- Trainee Empty State Condition -->
                            <template if:false={wrap.oppCount}>
                                <p class="slds-text-color_error">No related opportunities found for this account.</p>
                            </template>

                        </lightning-accordion-section>
                    </template>
                </lightning-accordion>
            </template>
        </div>

        <!-- BASIC POPUP MODAL SCREEN -->
        <template if:true={isModalOpen}>
            <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_x-small">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Update Opportunity Status</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <!-- Simple basic combobox dropdown list selection -->
                        <lightning-combobox
                            label="Select Final Stage"
                            value={selectedStageValue}
                            options={stageOptions}
                            onchange={handleStageDropdownChange}
                            required>
                        </lightning-combobox>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModalDialog} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Update" variant="brand" onclick={handleStageUpdateSubmit}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
