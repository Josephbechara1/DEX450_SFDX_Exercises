<template>
     <lightning-card title="Case Management Center" icon-name="standard:case">
        
        <!-- SECTION 1: Create Case Form -->
        <div class="slds-box slds-theme_default slds-var-m-around_medium">
            <h3 class="slds-text-heading_small slds-var-m-bottom_small">Create New Case</h3>
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input 
                        type="text" 
                        label="Subject" 
                        value={newSubject}
                        data-id="subject"
                        onchange={handleFormChange}
                        required>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input 
                        type="text" 
                        label="Description" 
                        value={newDescription}
                        data-id="description"
                        onchange={handleFormChange}>
                    </lightning-input>
                </div>
            </div>
            <lightning-button 
                label="Create Case" 
                variant="brand" 
                class="slds-var-m-top_medium" 
                onclick={handleCreateCase}>
            </lightning-button>
        </div>

        <!-- SECTION 2: Search Input & Case Datatable -->
        <div class="slds-box slds-theme_default slds-var-m-around_medium">
            <h3 class="slds-text-heading_small slds-var-m-bottom_small">Search & View Cases</h3>
            
            <div class="slds-var-m-bottom_medium slds-size_1-of-1 slds-medium-size_1-of-3">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                <lightning-input 
                    type="search" 
                    label="Search by Case Number" 
                    placeholder="e.g., 00001024"
                    value={searchKey}
                    onchange={handleSearchChange}>
                </lightning-input>
            </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                    <lightning-combobox
                        name="statusFilter"
                        label="Filter by Status"
                        value={statusFilter}
                        placeholder="Select Status"
                        options={dynamicStatusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>
                </div>  
            </div>
            <!-- Datatable to list rows -->
            <div style="height: 300px;">
                <lightning-datatable
                    key-field="Id"
                    data={cases}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </div>

    </lightning-card>
</template>
